{% extends "layout.html" %}    

{% block title %}
Tweet
{% endblock title %}



{% block content %}
<h1 class="text-5xl text-center text-white">Confirm Delete Tweet</h1>
<p class="text-center text-white">Are you sure you want to delete this tweet?</p>
<form method="post" class="text-center">
    {% csrf_token %}
    <button class="btn btn-error">Delete</button>
    <a href="{% url 'tweet_list' %}" class="btn btn-primary ml-4">Cancel</a>
{% endblock %}

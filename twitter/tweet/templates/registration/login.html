{% extends "layout.html" %}

{% block content %}
<style>
    /* 1. Style the Input Boxes */
    form p input {
        width: 100%;
        padding: 0.75rem;
        margin-top: 0.5rem;
        margin-bottom: 1rem;
        border: 2px solid black !important; /* Forces black outline */
        border-radius: 0.5rem;
        background-color: white !important;
        color: black !important;
        outline: none;
    }

    /* 2. Style the Labels (Username, Email, etc.) */
    form p label {
        display: block;
        font-weight: bold;
        color: black;
        margin-bottom: 0.25rem;
    }

    /* 3. Hide the messy "Help Text" (password rules) */
    .helptext {
        display: none;
    }
    
    /* 4. Ensure focus state looks good */
    form p input:focus {
        border-color: #570df8 !important; /* daisyUI Primary Color */
        box-shadow: 0 0 0 2px #570df8;
    }
</style>
<div class="flex items-center justify-center min-h-[70vh] px-4">
    <div class="card w-full max-w-sm shadow-2xl bg-base-100 border border-base-300">
        <div class="card-body">
            <h2 class="card-title text-2xl font-bold justify-center mb-4">Login Form</h2>
            
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <div class="form-control">
                    {{ form.as_p }}
                </div>
                
                <div class="card-actions justify-center mt-6">
                    <button class="btn btn-primary w-full" type="submit">Login</button>
                </div>
            </form>

            <div class="divider">OR</div>

            <p class="text-center text-sm">
                Don't have an account? 
                <a href="{% url 'register' %}" class="link link-primary font-semibold">Register here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

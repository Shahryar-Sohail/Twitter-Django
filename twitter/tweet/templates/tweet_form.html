{% extends "layout.html" %}    

{% block title %}
Tweet
{% endblock title %}



{% block content %}
<h1 class="text-5xl text-center text-white">Tweet Form Page</h1>
<div class= "container mx-auto mt-8 flex flex-col items-center">
<h2 class="text-2xl text-white">{% if form.instance.pk %} Edit Tweet {% else %} Create Tweet {% endif %}</h2>

<form method="post" enctype="multipart/form-data" class="flex flex-col gap-4 mt-4">
    {% csrf_token %}
    
    <div class="form-control">
        <label class="label"><span class="label-text text-white">Text:</span></label>
        <textarea name="text" class="textarea textarea-bordered h-24" placeholder="What's happening?">{{ form.text.value|default:'' }}</textarea>
    </div>

    <div class="form-control">
        <label class="label"><span class="label-text text-white">Photo:</span></label>
        <input type="file" name="photo" class="file-input file-input-bordered w-full max-w-xs" />
    </div>

    <button class="btn btn-warning w-fit" type="submit">Submit</button>
</form>
<a href="{% url 'tweet_list' %}" class="btn btn-primary mt-4">Back to Tweet List</a>

</div>

{% endblock %}
